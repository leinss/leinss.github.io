name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release
  # Manual trigger. A run can be created with zero jobs attached, in which case
  # it sits in `queued` forever and `gh run rerun` cannot recover it: rerun
  # replays the same empty run object. Only a new run object recovers, and
  # without this a throwaway commit is the only way to make one.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Runs on pull requests as well as pushes, so a broken build is caught in
  # review rather than at deploy time. `pnpm build` is `astro check && astro
  # build`, so type errors fail here too.
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        # No version here: the action reads `packageManager` from package.json,
        # so the pin lives in one place instead of two.
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # Build Node version — single-sourced from .node-version (also read by fnm).
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # One step, so a check added to `lint` runs in CI without editing this
      # file. The link check is not part of `lint`: it reads dist/ and so
      # belongs to the build, which runs it.
      - name: Lint
        run: pnpm run lint

      - name: Build Astro
        run: pnpm run build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Everything except a pull request deploys. Written as a negation rather
    # than a list of allowed events, so a trigger added above cannot silently
    # build without deploying: `== 'push'` skipped this job on every manual
    # run, which is the one case the manual trigger exists for.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
