name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - release
  pull_request:
    branches:
      - release

permissions:
  contents: write

jobs:
  # Runs on pull requests as well as pushes, so a broken build is caught in
  # review rather than at deploy time. `pnpm build` is `astro check && astro
  # build`, so type errors fail here too.
  build:
    name: Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        # No version here: the action reads `packageManager` from package.json,
        # so the pin lives in one place instead of two.
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # Build Node version — single-sourced from .node-version (also read by fnm).
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # One step, so a check added to `lint` runs in CI without editing this
      # file. The link check is not part of `lint`: it reads dist/ and so
      # belongs to the build, which runs it.
      - name: Lint
        run: pnpm run lint

      - name: Build Astro
        run: pnpm run build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
