name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Run the bundled JS actions (checkout/setup-node) on Node 24. This becomes
    # the runner default on 2026-06-16; the opt-in silences the deprecation
    # warning until then and can be removed afterwards.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # Build Node version — single-sourced from .node-version (also read by fnm).
          node-version-file: .node-version

      - name: Setup pnpm
        run: npm install -g pnpm@10.33.3

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
