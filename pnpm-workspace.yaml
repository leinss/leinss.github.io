# Allowlist native build scripts so `pnpm install` doesn't fail with
# ERR_PNPM_IGNORED_BUILDS (pnpm 10 ignores build scripts by default).
# The deploy workflow pins pnpm to 10.x, so this pnpm-10 setting name applies
# (pnpm 11 renamed it to "allowBuilds").
onlyBuiltDependencies:
  - esbuild
  - sharp

# Delay installing freshly published versions, so a compromised release has
# time to be caught before it lands here. Replaces `min-release-age=7` in
# .npmrc, which pnpm does not recognise and silently ignored: the real setting
# is `minimumReleaseAge`, it belongs in this file, and it is in MINUTES.
minimumReleaseAge: 10080 # 7 days
